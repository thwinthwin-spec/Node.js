<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
    <style>
        :root {
            --bg: #f5f7ff;
            --surface: #ffffff;
            --primary: #334dff;
            --primary-soft: #e7ecff;
            --text: #1f2937;
            --muted: #64748b;
            --border: #dbe2ef;
            --danger: #f97316;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top left, rgba(51, 77, 255, 0.14), transparent 35%),
                        linear-gradient(180deg, #ffffff 0%, #eef2ff 100%);
            color: var(--text);
            padding: 24px;
        }

        h1 {
            margin: 0 0 18px;
            font-size: clamp(2rem, 1.9rem + 0.4vw, 2.4rem);
            letter-spacing: -0.03em;
            color: #112e5a;
        }

        form {
            max-width: 420px;
            width: 100%;
            padding: 32px;
            border-radius: 24px;
            background: var(--surface);
            box-shadow: 0 24px 50px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(15, 23, 42, 0.04);
        }

        input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: #fbfdff;
            color: var(--text);
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(51, 77, 255, 0.12);
        }

        button {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 14px;
            background: var(--primary);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        button:hover {
            background: #243fe2;
            transform: translateY(-1px);
        }

        a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            form {
                padding: 24px;
            }
        }
    </style>
</head>
<body>

<h1>Edit Student</h1>

<form id="editForm">

    <input
        type="text"
        id="name"
        required
    >

    <br><br>

    <input
        type="number"
        id="age"
        required
    >

    <br><br>

    <input
        type="text"
        id="grade"
        required
    >

    <br><br>

    <button type="submit">
        Update Student
    </button>

</form>

<script>

const id =
window.location.pathname.split("/").pop();

fetch("/student/" + id)
.then(res => res.json())
.then(student => {

    document.getElementById("name").value =
    student.name;

    document.getElementById("age").value =
    student.age;

    document.getElementById("grade").value =
    student.grade;

});

document
.getElementById("editForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    fetch("/update-student/" + id, {

        method: "POST",

        headers: {
            "Content-Type":"application/json"
        },

        body: JSON.stringify({

            name:
            document.getElementById("name").value,

            age:
            document.getElementById("age").value,

            grade:
            document.getElementById("grade").value

        })

    })
    .then(() => {

        window.location.href =
        "/dashboard";

    });

});

</script>

</body>
</html>
