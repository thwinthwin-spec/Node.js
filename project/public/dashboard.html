<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        :root {
            --bg: #f4f8fb;
            --card: #ffffff;
            --primary: #1f75fe;
            --primary-dark: #164dc2;
            --text: #1f2937;
            --muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top left, rgba(31, 117, 254, 0.12), transparent 35%),
                        linear-gradient(180deg, #ffffff 0%, #f4f8fb 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
        }

        h1 {
            margin: 0 0 18px;
            font-size: clamp(2rem, 1.8rem + 0.5vw, 2.5rem);
            letter-spacing: -0.03em;
            color: #0f172a;
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        a[href="/student"] {
            display: inline-block;
            margin-bottom: 20px;
            padding: 12px 20px;
            border-radius: 999px;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        a[href="/student"]:hover {
            background: var(--primary-dark);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.07);
            border-radius: 20px;
            overflow: hidden;
        }

        thead {
            background: #f8fafc;
        }

        th,
        td {
            padding: 16px 18px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            font-size: 0.95rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 700;
        }

        tbody tr:hover {
            background: #f8fbff;
        }

        td {
            color: #334155;
        }

        td a {
            margin-right: 12px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(31, 117, 254, 0.1);
            color: var(--primary);
            font-size: 0.95rem;
        }

        td a:last-child {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        td a:hover {
            opacity: 0.92;
        }

        @media (max-width: 680px) {
            body {
                padding: 16px;
            }

            table,
            thead,
            tbody,
            th,
            td,
            tr {
                display: block;
            }

            thead tr {
                position: absolute;
                top: -9999px;
                left: -9999px;
            }

            tr {
                margin-bottom: 18px;
                border-radius: 18px;
                overflow: hidden;
                box-shadow: 0 16px 28px rgba(15, 23, 42, 0.06);
            }

            td {
                border: none;
                padding: 12px 16px;
                position: relative;
            }

            td:before {
                content: attr(data-label);
                display: block;
                margin-bottom: 6px;
                font-size: 0.8rem;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.08em;
            }

            td a {
                display: inline-block;
                margin-top: 8px;
            }
        }

        .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logout{
    background:#ef4444;
    color:white;
    padding:10px 16px;
    border-radius:8px;
    text-decoration:none;
}
    </style>
</head>
<body>

<h1>Student Dashboard</h1>

<a href="/student">Add Student</a>

<br><br>

<table border="1">

    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Grade</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="tableData"></tbody>

</table>
<<div class="topbar">

    <h1>Student Dashboard</h1>

    <a href="/logout" class="logout">
        Logout
    </a>

</div>
<script>

fetch("/students")
.then(res => res.json())
.then(data => {

    let rows = "";

    data.forEach(student => {

        rows += `
        <tr>

            <td>${student.id}</td>

            <td>${student.name}</td>

            <td>${student.age}</td>

            <td>${student.grade}</td>

            <td>

                <a href="/edit-student/${student.id}">
                    Edit
                </a>

                <a
                    href="/delete-student/${student.id}"
                    onclick="return confirm('Delete Student?')">
                    Delete
                </a>

            </td>

        </tr>
        `;

    });

    document.getElementById("tableData").innerHTML = rows;

});

</script>

</body>
</html>
